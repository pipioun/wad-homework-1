<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - PostIt</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <nav class="navbar">
            <a href="index.html" class="brand">PostIt</a>

            <div class="nav-actions">
                <a href="index.html" class="nav-link">Home</a>
                <a href="addPost.html" class="nav-link">Add Post</a>
                <a href="login.html" class="profile-icon">👤</a>
            </div>
        </nav>
    </header>

    <main class="login-main">

        <section class="page-intro">
            <p class="eyebrow">WELCOME BACK</p>
            <h1>Log in to PostIt</h1>
            <p>Please enter your details to continue.</p>
        </section>

        <form class="login-form" action="index.html" method="get">

            <div class="form-row">
                <label for="email">Email</label>
                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required>
            </div>

            <div class="form-row">
                <label for="password">Password</label>
                <input
                    type="password"
                    id="password"
                    placeholder="Enter your password"
                    required>
            </div>

            <button type="submit" class="button button-primary">
                Log in
            </button>

            <p class="login-links">
                <a href="#">Create an account</a>
                <span>or</span>
                <a href="#">Forgot password?</a>
            </p>

        </form>

    </main>

    <footer class="site-footer">
        <p>PostIt - Web Application Development</p>
    </footer>

</body>
</html>
